name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev tooling
        # Install only ruff + pytest here. Full deps (torch, PyG, ViennaRNA)
        # are heavy and pulled in a follow-up job when the codebase needs
        # them at import time in tests.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.5.5" "pytest==8.2.2"

      - name: Install package (no extras)
        # Install in editable mode without optional deps so 'import cascade'
        # works in tests. Heavy deps are unpinned here intentionally; CI for
        # the full stack will live in a separate workflow once needed.
        run: |
          python -m pip install --no-deps -e .

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Forbid em-dashes
        run: |
          git ls-files -z | xargs -0 python scripts/check_no_em_dash.py

      - name: Pytest
        run: pytest -q
