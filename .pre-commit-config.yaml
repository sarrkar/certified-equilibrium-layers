# Pre-commit hooks for CASCADE. Install with:
#   pre-commit install
# Run on all files with:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Local hook: forbid em-dashes anywhere in the repo (project contract rule 4).
  - repo: local
    hooks:
      - id: no-em-dash
        name: forbid em-dashes
        description: Em-dashes are banned per OUTLINE.md rule 4.
        entry: python scripts/check_no_em_dash.py
        language: system
        pass_filenames: true
        types_or: [python, markdown, tex, yaml, toml, text]
