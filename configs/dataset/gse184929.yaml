# Real off-target dataset: STRING GRN + GSE184929 log2FC labels, held-out-gene split.
#
# This requires a precomputed node table (parquet) that joins the per-transcript
# concept features (cascade.features) with the GSE184929 log2FC labels
# (cascade.data.geo) onto the STRING nodes. The join needs a transcript id map
# that is not wired yet; until then build_cascade_data raises a clear error in
# non-synthetic mode. See cascade.data.cascade_dataset for the contract.

graph: data/raw/STRING/10116.protein.links.v12.0.txt.gz
threshold: 700
cache: data/cache

synthetic: false
node_table: null         # parquet: feature columns + 'log2fc' + 'gene'
contrast: D1_30mg        # GSE184929 dose / guide contrast to regress against

split:
  mode: held_out_gene
  val_frac: 0.2
  test_frac: 0.2
