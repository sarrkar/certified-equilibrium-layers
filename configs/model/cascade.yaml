# CASCADE model: CCMP backbone (per-concept FiLM message passing) + propagation head.

# CCMP backbone
hidden_dim: 32        # per-node-type hidden width inside each concept stream
concept_emb_dim: 32   # FiLM conditioning embedding width per concept
n_layers: 2           # FiLM-HeteroSAGE message-passing steps per concept
head_hidden: 16       # concept-scalar head hidden width
dropout: 0.0

# Propagation head (certified containment)
prop_steps: 10        # APPNP power-iteration steps (propagation horizon)
alpha_init: 0.15      # initial teleport probability (parameterized as sigmoid(theta))
learnable_alpha: true # alpha is the single interpretable locality knob
