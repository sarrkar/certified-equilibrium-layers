# Top-level CASCADE training config (hydra).
#
# Compose with: python train.py model=cascade dataset=fixture training=smoke
# Override anything from the CLI, e.g. python train.py seed=1 training.epochs=100

defaults:
  - model: cascade
  - dataset: fixture
  - training: smoke
  - _self_

# Seed is logged each run (CLAUDE.md rule 3). No silent default: set explicitly.
seed: 0
device: cpu
out_dir: outputs

hydra:
  run:
    dir: ${out_dir}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    # Keep the working directory at the repo root so relative fixture paths resolve.
    chdir: false
